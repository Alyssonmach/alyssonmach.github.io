# Configuração do site; reinicie o servidor após alterar este arquivo.
locale                   : "pt-BR"
site_theme               : "default"
title                    : "Alysson Machado"
title_separator          : "-"
name                     : &name "Alysson Machado"
description              : &description "Your Name's academic portfolio"
url                      : https://alyssonmach.github.io
baseurl                  : ""
repository               : "Alyssonmach/alyssonmach.github.io"

# Perfil lateral; campos vazios não exibem links.
author:
  avatar           : "profile.png"
  name             : "Alysson Machado"
  pronouns         : "he/him"
  bio              : "Mestrando em Engenharia Elétrica | Machine Learning | Deep Learning | Visão Computacional | PD&I | Processamento de Imagens Digitais |"
  location         : "Campina Grande, PB"
  employer         : "UFCG"
  uri              :
  email            : "alysson.barbosa@ee.ufcg.edu.br"

  lattes           : "http://lattes.cnpq.br/0536933202710340"
  academia         :
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?user=0N7ZgOgAAAAJ&hl=pt-BR"
  inspire-hep      :
  impactstory      :
  orcid            : "https://orcid.org/0000-0003-3025-9382"
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     : "https://www.researchgate.net/profile/Alysson-Machado-2"
  scopus           :
  zotero           :

  bitbucket        :
  codepen          :
  dribbble         :
  github           : "Alyssonmach"
  kaggle           :
  stackoverflow    :

  artstation       :
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         : "alyssonmac"
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :

# Categorias herdadas do template; a listagem atual usa _data/publication_categories.yml.
publication_category:
  conferences:
    title: 'Trabalhos em congressos'
  manuscripts:
    title: 'Resumos em periódico'
  presentations:
    title: 'Apresentações em congressos'
  theses:
    title: 'Trabalhos acadêmicos'

# Conteúdo e recursos opcionais do template.
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               :
  disqus:
    shortname            :
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          :
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"
atom_feed:
  hide                   : true
  path                   :

# Verificação de mecanismos de busca.
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Metadados para compartilhamento.
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
og_description           :
social:
  type                   :
  name                   :
  links:

# Analytics.
analytics:
  provider               :  "false"
  google:
    tracking_id          :

# Leitura de arquivos.
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversão de conteúdo.
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Processamento de Markdown.
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Coleções publicadas.
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Valores padrão de páginas e coleções.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Compilação de estilos.
sass:
  sass_dir: _sass
  style: compressed

# Endereços e fuso horário.
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins compatíveis com GitHub Pages.
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Arquivos por categoria e tag.
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Compressão de HTML.
compress_html:
  clippings: all
  ignore:
    envs: development
